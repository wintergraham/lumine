[workspace]
members = ["crates/lumine", "crates/lumine-desktop", "crates/lumine-gpu", "comparisons/workload"]
exclude = ["comparisons/gpui", "comparisons/quickgui", "vendor/taffy"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

# wgpu-hal with a Metal backend patch: command buffers are created lazily and
# empty ones are never committed. Upstream opens several per submission; each
# costs a commit, a completion callback and Core Animation frame-pacing IPC.
# See vendor/wgpu-hal/LUMINE_PATCH.md.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
cosmic-text = { path = "vendor/cosmic-text" }
